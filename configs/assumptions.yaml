# ============================================================
# assumptions.yaml — Giả định tồn kho cho Phase 5
# Tất cả tham số chi phí và vận hành đặt ở đây, KHÔNG hard-code trong code.
# ⚠ ĐÂY LÀ GIẢ ĐỊNH TẠM, CHƯA ĐƯỢC NHÓM DUYỆT.
#    Mọi giá trị dưới đây do nhóm phát triển đề xuất để chạy thử;
#    chưa có biên bản/thống nhất chính thức. Cần nhóm xác nhận trước khi
#    dùng cho báo cáo cuối.
# ============================================================

# --- Lead time ---
lead_time_days: 7
# Giả định: Đơn hàng giao sau 7 ngày (cố định, không ngẫu nhiên).
# Kịch bản stress-test sẽ tăng lên lead_time_days_stress (xem phần stress).

# --- Chi phí (tính trên mỗi đơn vị sản phẩm = 1 mặt hàng bán lẻ) ---
# Nguồn: Giả định minh họa theo tài liệu thuyết minh. Không phải số thực từ Walmart.
ordering_cost: 5.0
# Chi phí cố định mỗi lần đặt hàng (ký hiệu K). Bao gồm xử lý đơn + vận chuyển.
# Đơn vị: tiền tệ tùy ý (giống đơn vị sell_price).

holding_cost_per_unit_per_day: 0.002032
# Chi phí lưu kho mỗi đơn vị mỗi ngày (ký hiệu h).
# ⚠ GIẢ ĐỊNH TẠM, CHƯA ĐƯỢC NHÓM DUYỆT (mức B, 1,5%/tháng).
# Cách tính:
#   giá bán trung bình 60 SKU (data/processed/sales_daily.parquet) = 4,064
#   h = (1,5%/tháng) × 4,064 / 30 ngày = 0,002032 /đơn vị/ngày
#   tương đương 18%/năm tính trên giá bán (chưa dùng giá vốn/COGS).
# Ba mức tham chiếu đã báo cáo: A = 0,001355 (1,0%/tháng),
#   B = 0,002032 (1,5%/tháng), C = 0,002709 (2,0%/tháng).
# Lưu ý: đây là giả định tạm để chạy thử, cần nhóm chốt lại trước báo cáo cuối.

shortage_cost_per_unit: 2.0
# Chi phí thiếu hàng mỗi đơn vị không đáp ứng được (ký hiệu p).
# Mô hình: lost sales (nhu cầu thiếu bị mất, không backorder).

# --- Mức dịch vụ & Safety Stock ---
service_level: 0.95
# Xác suất không thiếu hàng trong chu kỳ bổ sung (cycle service level).
# z được TÍNH TỰ ĐỘNG từ service_level bằng phân phối chuẩn tắc
# (xem src/inventory/policies.py: z_from_service_level), KHÔNG hard-code.
# Ví dụ: 0.90 → z≈1.2816; 0.95 → z≈1.6449; 0.99 → z≈2.3263.

# --- Cửa sổ ước lượng baseline ---
baseline_window_days: 91
# Baseline chính dùng trung bình & độ lệch chuẩn của bao nhiêu ngày gần nhất
# trước origin. Chỉ dùng dữ liệu đến origin của từng fold.
# Biến thể đối chiếu Baseline_full_history dùng toàn bộ lịch sử (không cắt).

# --- Chính sách đặt hàng ---
reorder_quantity_days: 14
# Lượng đặt hàng = kỳ vọng nhu cầu trong bao nhiêu ngày (order cycle).
# Mặc định 14 ngày: đặt bổ sung tương đương 2 tuần cầu dự báo.

initial_inventory_days: 7
# Tồn kho ban đầu = nhu cầu trung bình × số ngày này.
# Giống nhau cho MỌI chính sách, chỉ dùng nhu cầu thực trước origin.

initial_inventory_lookback_days: 28
# Số ngày gần nhất trước origin dùng để ước lượng nhu cầu trung bình
# khi tính tồn kho ban đầu (không dùng dự báo).

# --- Kịch bản Stress-test ---
stress:
  demand_spike_factor: 2.0
  # Hệ số nhân nhu cầu trong kịch bản nhu cầu tăng đột biến (demand shock).
  # Áp dụng trên toàn bộ giai đoạn mô phỏng của từng fold.

  lead_time_days_extended: 14
  # Lead time kéo dài trong kịch bản giao hàng trễ (supply disruption).
  # Tăng gấp đôi so với lead_time_days = 7.
